<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Harbor: Vice Run</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #07080f; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Harbor: Vice Run — a top-down open-world courier game. Walk and drive with WASD, press E to enter cars, aim with the mouse."></canvas>
<p id="status" role="status" aria-live="polite">Neon Harbor: Vice Run. Press Enter to start.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
